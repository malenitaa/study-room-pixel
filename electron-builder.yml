appId: com.malena.studyroompixel
productName: Study Room Pixel
directories:
  buildResources: build
files:
  - out/**/*
  - resources/**/*
  - package.json
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  # Sin identity: build ad-hoc/sin firmar a propósito (no hay cuenta de desarrollador Apple para
  # esta app personal — ver INSTALAR.md para cómo abrirla igual sorteando Gatekeeper). Forzar esto
  # explícito también evita que electron-builder intente autodetectar y usar CUALQUIER identidad
  # que encuentre en el keychain del que compila.
  identity: null
  gatekeeperAssess: false
dmg:
  writeUpdateInfo: false
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
npmRebuild: false
publish: null
